name: Build and Deploy Static Site

on:
  push:
    branches:
      - main
  schedule:
    # Run daily at midnight UTC to fetch the latest newsletter articles
    - cron: '0 0 * * *'
  workflow_dispatch:
    # Allow manual triggering from the Actions tab

concurrency:
  group: personal-site-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check site builder
        run: python -m unittest discover -s tests

      - name: Run static site builder
        # Newsletter refreshes use the reviewed, committed brand build.
        # The private submodule is pulled locally when explicitly updating style.
        run: python build.py --prebuilt-brand

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add index.html now/index.html about/index.html projects.html articles.html data/latest-articles.json static/article-cover.jpg
          # Check if there are any changes staged for commit, then commit and push
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh latest newsletter articles [skip ci]"
            git push
          else
            echo "No changes to commit"
          fi

      - name: Package public site files
        run: python package_site.py .pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .pages

  deploy:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy built site
        id: deployment
        uses: actions/deploy-pages@v4
